    <!-- Load Components -->
    <script>
        // Function to load HTML components
        async function loadComponent(containerId, filePath) {
            try {
                const response = await fetch(filePath);
                const html = await response.text();
                document.getElementById(containerId).innerHTML = html;
            } catch (error) {
                console.error(`Error loading ${filePath}:`, error);
            }
        }

        // Load all components
        document.addEventListener('DOMContentLoaded', async function () {
            // Cargar todos los componentes
            await loadComponent('navbar-container', 'components/navbar.html');
            await loadComponent('home-container', 'components/home.html');
            await loadComponent('about-container', 'components/about.html');
            await loadComponent('certifications-container', 'components/certifications.html');
            await loadComponent('clients-container', 'components/clients.html');
            await loadComponent('services-container', 'components/services.html');
            await loadComponent('quotes-container', 'components/quotes.html');
            await loadComponent('contact-container', 'components/contact.html');
            await loadComponent('fraud-container', 'components/fraud.html');
            await loadComponent('footer-container', 'components/footer.html');

            // IMPORTANTE: Esperar un momento para que el DOM se actualice
            setTimeout(() => {
                // Initialize main functionality after all components are loaded
                if (typeof initializeApp === 'function') {
                    initializeApp();
                }
            }, 100);

            // Funcionalidad del Acordeón de Fraudes
            const fraudHeader = document.getElementById('fraudAccordionHeader');
            const fraudContent = document.getElementById('fraudAccordionContent');

            if (fraudHeader && fraudContent) {
                fraudHeader.addEventListener('click', function () {
                    this.classList.toggle('active');
                    fraudContent.classList.toggle('active');
                });
            }
        });
    </script>

    <!-- WhatsApp Floating Button -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mainFab = document.getElementById('main-whatsapp-fab');
            const container = document.querySelector('.whatsapp-fab-container');

            mainFab.addEventListener('click', () => {
                // 1. Alterna la clase 'active' en el contenedor para activar los estilos CSS
                container.classList.toggle('active');

                // 2. Lógica para cambiar el icono (WhatsApp <-> Cerrar)
                const mainIcon = mainFab.querySelector('i');

                if (container.classList.contains('active')) {
                    // Si está activo, cambia el icono a un símbolo de cerrar
                    mainIcon.classList.remove('fa-brands', 'fa-whatsapp');
                    mainIcon.classList.add('fa-solid', 'fa-x'); // Icono de 'X'
                } else {
                    // Si no está activo, vuelve al icono de WhatsApp
                    mainIcon.classList.remove('fa-solid', 'fa-x');
                    mainIcon.classList.add('fa-brands', 'fa-whatsapp');
                }
            });
        });
    </script>

    <!-- Script para toggle de vistas -->
    <script>
        function toggleQuoteView(view) {
            const formView = document.getElementById('form-view');
            const whatsappView = document.getElementById('whatsapp-view');
            const btnForm = document.querySelector('.btn-form');
            const btnWhatsapp = document.querySelector('.btn-whatsapp');

            if (view === 'form') {
                formView.style.display = 'block';
                whatsappView.style.display = 'none';
                btnForm.classList.add('active');
                btnWhatsapp.classList.remove('active');
            } else if (view === 'whatsapp') {
                formView.style.display = 'none';
                whatsappView.style.display = 'block';
                btnForm.classList.remove('active');
                btnWhatsapp.classList.add('active');
            }
        }
    </script>
