    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/privacy.css">

    <script src="assets/lib/sweetalert/sweetalert2.all.min.js"></script>
</head>
<body>
    <!-- Navigation -->
    <div id="navbar-container"></div>

    <!-- Land International Content -->
    <div id="privacy-container"></div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="assets/lib/bootstrap/bootstrap.bundle.min.js"></script>
    
    <!-- Translations - IMPORTANTE: Cargar ANTES de translations.js -->
    <script src="assets/js/translations/navbar-services-translations.js"></script>
    <script src="assets/js/translations/home-translations.js"></script>
    <script src="assets/js/translations/about-translations.js"></script>
    <script src="assets/js/translations/services-translations.js"></script>
    <script src="assets/js/translations/certifications-translations.js"></script>
    <script src="assets/js/translations/clients-translations.js"></script>
    <script src="assets/js/translations/quotes-translations.js"></script>
    <script src="assets/js/translations/contact-translations.js"></script>
    <script src="assets/js/translations/footer-translations.js"></script>
    <script src="assets/js/translations/air-translations.js"></script>
    <script src="assets/js/translations/land-international-translations.js"></script>
    <script src="assets/js/translations/land-national-translations.js"></script>
    <script src="assets/js/translations/maritime-translations.js"></script>
    
    <!-- Translations Main - DEBE ir después de los archivos individuales -->
    <script src="assets/js/translations.js"></script>
    
    <!-- Main JS - DEBE ir después de translations.js -->
    <script src="assets/js/main-services.js"></script>
    
    <!-- Load Components -->
    <script>
        // Function to load HTML components
        async function loadComponent(containerId, filePath) {
            try {
                const response = await fetch(filePath);
                const html = await response.text();
                document.getElementById(containerId).innerHTML = html;
            } catch (error) {
                console.error(`Error loading ${filePath}:`, error);
            }
        }

        // Load all components
        document.addEventListener('DOMContentLoaded', async function() {
            // Cargar todos los componentes
            await loadComponent('navbar-container', 'components/navbar.html');
            await loadComponent('privacy-container', 'components/privacy.html');
            await loadComponent('footer-container', 'components/footer.html');
            
            // IMPORTANTE: Esperar un momento para que el DOM se actualice
            setTimeout(() => {
                // Initialize main functionality after all components are loaded
                if (typeof initializeApp === 'function') {
                    initializeApp();
                }
            }, 100);
        });
    </script>
</body>
</html>
