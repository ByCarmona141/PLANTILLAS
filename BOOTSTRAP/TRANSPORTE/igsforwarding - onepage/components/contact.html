<section class="contact-section" id="contacto">
    <div class="container">
        <div class="text-center mb-5">
            <h2 class="section-title" data-translate="contact_title">Contáctanos</h2>
            <p class="section-subtitle" data-translate="contact_subtitle">Estamos aquí para ayudarte</p>
        </div>
        
        <div class="row">
            <div class="col-lg-6 mb-4 mb-lg-0">
                <div class="text-center">
                    <h3 class="section-title-map" data-translate="contact_title_map1">Nuestras Oficinas</h3>
                </div>
                <div class="map-container">
                    <iframe class="w-100 h-100" src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d7545.2170449703935!2d-98.27825!3d18.9928889!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85cfb90047a73789%3A0xed9700775e229d7b!2sIGS%20Forwarding%20Oficinas%20Administrativas!5e0!3m2!1ses-419!2smx!4v1759793656928!5m2!1ses-419!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
                <div class="text-center">
                    <h3 class="section-title-map mt-3" data-translate="contact_title_map2">Nuestro Patio</h3>
                </div>
                <div class="map-container">
                    <iframe class="w-100 h-100" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3769.437838544945!2d-98.2384513!3d19.132302499999994!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85cfc0f282044825%3A0x72bfbbba24a126c!2sIGS%20Forwarding!5e0!3m2!1ses-419!2smx!4v1761670371024!5m2!1ses-419!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="quote-form">
                    <h3 class="mb-4" data-translate="contact_form_title">Envíanos un Mensaje</h3>
                    <form id="contactForm" action="https://formspree.io/f/mqagrjdz" method="POST">
                        <div class="mb-3">
                            <input type="text" name="name" class="form-control" placeholder="Nombre" data-placeholder="contact_form_name" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" name="email" class="form-control" placeholder="Email" data-placeholder="contact_form_email" required>
                        </div>
                        <div class="mb-3">
                            <input type="tel" name="phone" class="form-control" placeholder="Teléfono" data-placeholder="contact_form_phone" required>
                        </div>
                        <div class="mb-3">
                            <input type="text" name="subject" class="form-control" placeholder="Asunto" data-placeholder="contact_form_subject" required>
                        </div>
                        <div class="mb-3">
                            <textarea name="message" class="form-control" rows="5" placeholder="Mensaje" data-placeholder="contact_form_message" required></textarea>
                        </div>
                        <button type="submit" class="btn custom-btn-tertiary w-100">
                            <i class="fas fa-paper-plane me-2"></i>
                            <span data-translate="contact_form_btn">Enviar Mensaje</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
